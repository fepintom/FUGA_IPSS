[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuga-ipss"
version = "0.4.0"
description = "Detección temprana de deserción estudiantil — InnovaLab, Instituto Profesional San Sebastián"
authors = [{ name = "Fernando Pinto Montecinos", email = "fepintom@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "nbstripout>=0.6", "jupyter"]

[project.scripts]
fuga-ipss = "fuga_ipss.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
